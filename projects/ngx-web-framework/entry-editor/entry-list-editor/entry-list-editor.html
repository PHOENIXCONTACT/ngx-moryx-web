<div class="add-item">
  <mat-form-field class="type-selector" appearance="outline" subscriptSizing="dynamic">
    <mat-label>Select the type of object</mat-label>
    <mat-select [(ngModel)]="selectedListItemType" [disabled]="disabled()">
      @for (pv of possibleListItemTypes(); track pv.key) {
        <mat-option [value]="pv.key">{{ pv.displayName ?? pv.key }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <button mat-icon-button class="add-button" type="button"
    (click)="addItemToList()" [disabled]="disabled()" [class.disabled]="disabled()">
    <mat-icon>playlist_add</mat-icon>
  </button>
</div>

@if (entry().subEntries?.length) {
  <mat-list class="items">
    @for (subEntry of entry().subEntries; track subEntry.identifier) {
      <entry-list-item class="item" [editorId]="editorId()"
        [entry]="subEntry" (entryChange)="updateSubEntry($event)"
        [disabled]="disabled()"
        [isFirst]="$first" [isLast]="$last"
        (deleteRequest)="onDeleteListItem($event)"
        (moveUpRequest)="onMoveListItemUp($event)"
        (moveDownRequest)="onMoveListItemDown($event)">
      </entry-list-item>
    }
  </mat-list>
}
