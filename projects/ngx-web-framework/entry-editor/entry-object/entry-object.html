<div class="entry-object">
  <button mat-stroked-button (click)="onOpen()" type="button">
    {{ entry().displayName }}
    <mat-icon iconPositionEnd>chevron_right</mat-icon>
  </button>

  @if (entry().description) {
    <div class="entry-hint" [class.entry-editor-disabled]="disabled()">
      {{ entry().description }}
    </div>
  }
</div>
